name: Python Testing

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'infrastructure/**/*.py'
      - 'infrastructure/requirements.txt'
      - '.github/workflows/python-testing.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'infrastructure/**/*.py'
      - 'infrastructure/requirements.txt'

env:
  PYTHON_VERSION: '3.9'

jobs:
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint black isort mypy
      
      - name: Run Black (code formatter check)
        run: |
          black --check infrastructure/
        continue-on-error: true
      
      - name: Run isort (import sorting check)
        run: |
          isort --check-only infrastructure/
        continue-on-error: true
      
      - name: Run Flake8 (style guide enforcement)
        run: |
          flake8 infrastructure/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 infrastructure/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run Pylint (code analysis)
        run: |
          pylint infrastructure/**/*.py --exit-zero --max-line-length=127
        continue-on-error: true
      
      - name: Run MyPy (type checking)
        run: |
          mypy infrastructure/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infrastructure/requirements.txt
          pip install pytest pytest-cov pytest-mock
      
      - name: Run unit tests with coverage
        run: |
          cd infrastructure
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html --cov-report=term
        continue-on-error: false
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./infrastructure/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Archive coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: infrastructure/htmlcov/

  property-based-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infrastructure/requirements.txt
          pip install pytest hypothesis
      
      - name: Run property-based tests
        run: |
          cd infrastructure
          pytest tests/property/ -v --tb=short
        env:
          HYPOTHESIS_PROFILE: ci
        continue-on-error: false
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: property-test-results
          path: infrastructure/test-results/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Run Bandit (security linter)
        run: |
          bandit -r infrastructure/ -f json -o bandit-report.json
        continue-on-error: true
      
      - name: Run Safety (dependency vulnerability check)
        run: |
          safety check --json --output safety-report.json
        continue-on-error: true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  integration-tests:
    name: Integration Tests (Dry Run)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infrastructure/requirements.txt
          pip install pytest
      
      - name: Validate integration test syntax
        run: |
          cd infrastructure
          python -m py_compile tests/integration/*.py
      
      - name: Comment PR - Integration Tests
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Integration Tests**\n\nIntegration tests are validated for syntax but not executed in CI. Run them manually after deployment:\n\n```bash\ncd infrastructure/tests/integration\npython test_failover_aws_to_azure.py\npython test_database_replication.py\npython test_security_controls.py\n```'
            })

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=multicloud-dr-system
            -Dsonar.organization=your-org
            -Dsonar.sources=infrastructure
            -Dsonar.python.coverage.reportPaths=infrastructure/coverage.xml
        continue-on-error: true

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests
      - property-based-tests
      - security-scan
    if: always()
    
    steps:
      - name: Check test results
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Property Tests: ${{ needs.property-based-tests.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.property-based-tests.result }}" != "success" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          
          echo "✅ All tests passed"
      
      - name: Comment PR - Test Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const lintStatus = '${{ needs.lint.result }}' === 'success' ? '✅' : '❌';
            const unitStatus = '${{ needs.unit-tests.result }}' === 'success' ? '✅' : '❌';
            const propertyStatus = '${{ needs.property-based-tests.result }}' === 'success' ? '✅' : '❌';
            const securityStatus = '${{ needs.security-scan.result }}' === 'success' ? '✅' : '⚠️';
            
            const output = `## Test Summary
            
            | Test Suite | Status |
            |------------|--------|
            | Lint | ${lintStatus} |
            | Unit Tests | ${unitStatus} |
            | Property-Based Tests | ${propertyStatus} |
            | Security Scan | ${securityStatus} |
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
