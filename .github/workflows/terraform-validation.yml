name: Terraform Validation

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-validation.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'infrastructure/terraform/**'

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: 'us-east-1'

jobs:
  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Format Check
        id: fmt
        run: |
          cd infrastructure/terraform
          terraform fmt -check -recursive
        continue-on-error: true
      
      - name: Comment PR - Format Issues
        if: steps.fmt.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Terraform Format Check Failed**\n\nPlease run `terraform fmt -recursive` in the `infrastructure/terraform` directory and commit the changes.'
            })
      
      - name: Fail if format check failed
        if: steps.fmt.outcome == 'failure'
        run: exit 1

  terraform-validate-aws:
    name: Validate AWS Terraform
    runs-on: ubuntu-latest
    needs: terraform-fmt
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Terraform Init - AWS
        run: |
          cd infrastructure/terraform/aws
          terraform init -backend=false
      
      - name: Terraform Validate - AWS
        run: |
          cd infrastructure/terraform/aws
          terraform validate
      
      - name: Terraform Plan - AWS
        if: github.event_name == 'pull_request'
        id: plan
        run: |
          cd infrastructure/terraform/aws
          terraform plan -no-color -input=false
        continue-on-error: true
      
      - name: Comment PR - AWS Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const output = `#### Terraform Plan - AWS 📋
            
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  terraform-validate-azure:
    name: Validate Azure Terraform
    runs-on: ubuntu-latest
    needs: terraform-fmt
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Terraform Init - Azure
        run: |
          cd infrastructure/terraform/azure
          terraform init -backend=false
      
      - name: Terraform Validate - Azure
        run: |
          cd infrastructure/terraform/azure
          terraform validate
      
      - name: Terraform Plan - Azure
        if: github.event_name == 'pull_request'
        id: plan
        run: |
          cd infrastructure/terraform/azure
          terraform plan -no-color -input=false
        continue-on-error: true
      
      - name: Comment PR - Azure Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const output = `#### Terraform Plan - Azure 📋
            
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  terraform-validate-gcp:
    name: Validate GCP Terraform
    runs-on: ubuntu-latest
    needs: terraform-fmt
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      
      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
      
      - name: Terraform Init - GCP
        run: |
          cd infrastructure/terraform/gcp
          terraform init -backend=false
      
      - name: Terraform Validate - GCP
        run: |
          cd infrastructure/terraform/gcp
          terraform validate
      
      - name: Terraform Plan - GCP
        if: github.event_name == 'pull_request'
        id: plan
        run: |
          cd infrastructure/terraform/gcp
          terraform plan -no-color -input=false
        continue-on-error: true
      
      - name: Comment PR - GCP Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const output = `#### Terraform Plan - GCP 📋
            
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  terraform-security-scan:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    needs: terraform-fmt
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: infrastructure/terraform
          soft_fail: true
      
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: true
          output_format: sarif
          output_file_path: reports/checkov.sarif
      
      - name: Upload Checkov results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: reports/checkov.sarif

  terraform-cost-estimate:
    name: Terraform Cost Estimate
    runs-on: ubuntu-latest
    needs: terraform-fmt
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Setup Infracost
        uses: infracost/actions/setup@v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      
      - name: Generate Infracost JSON
        run: |
          cd infrastructure/terraform
          infracost breakdown --path . --format json --out-file /tmp/infracost.json
      
      - name: Post Infracost comment
        uses: infracost/actions/comment@v1
        with:
          path: /tmp/infracost.json
          behavior: update

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: 
      - terraform-validate-aws
      - terraform-validate-azure
      - terraform-validate-gcp
      - terraform-security-scan
    if: always()
    
    steps:
      - name: Check validation results
        run: |
          echo "AWS Validation: ${{ needs.terraform-validate-aws.result }}"
          echo "Azure Validation: ${{ needs.terraform-validate-azure.result }}"
          echo "GCP Validation: ${{ needs.terraform-validate-gcp.result }}"
          echo "Security Scan: ${{ needs.terraform-security-scan.result }}"
          
          if [ "${{ needs.terraform-validate-aws.result }}" != "success" ] || \
             [ "${{ needs.terraform-validate-azure.result }}" != "success" ] || \
             [ "${{ needs.terraform-validate-gcp.result }}" != "success" ]; then
            echo "❌ Terraform validation failed"
            exit 1
          fi
          
          echo "✅ All Terraform validations passed"
